# This is a Databricks asset bundle definition for basic_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: basic_bundle
  uuid: 684214f1-d5ac-433f-bd07-f96329c5ea6d

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-d130f595-d6bd.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-d130f595-d6bd.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/harrybwatson@protonmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/harrybwatson@protonmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: harrybwatson@protonmail.com
        level: CAN_MANAGE

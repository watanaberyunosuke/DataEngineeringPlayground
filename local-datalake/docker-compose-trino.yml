version: "3.9"

services:
  trino-coordinator:
    image: trinodb/trino:latest
    container_name: trino-coordinator
    ports:
      - "8080:8080"
    volumes:
      # Only override specific files; leave default /etc/trino intact
      - ./trino-config/coordinator/config.properties:/etc/trino/config.properties:ro
      - ./trino-config/coordinator/init.sql:/etc/trino/init.sql:ro
      - ./trino-config/catalog:/etc/trino/catalog:ro

  trino-worker-1:
    image: trinodb/trino:latest
    container_name: trino-worker-1
    depends_on:
      - trino-coordinator
    volumes:
      - ./trino-config/worker/config.properties:/etc/trino/config.properties:ro
      - ./trino-config/catalog:/etc/trino/catalog:ro

  trino-worker-2:
    image: trinodb/trino:latest
    container_name: trino-worker-2
    depends_on:
      - trino-coordinator
    volumes:
      - ./trino-config/worker/config.properties:/etc/trino/config.properties:ro
      - ./trino-config/catalog:/etc/trino/catalog:ro
